services:
  # CodeLens Backend Service
  - type: web
    name: codelens-api
    env: python
    buildCommand: "pip install -r backend/requirements.txt && python backend/manage.py collectstatic --noinput"
    startCommand: "gunicorn --chdir backend codelens.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: codelens-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: codelens-redis
          property: connectionString
      - key: AI_PROVIDER
        value: "mock"
      - key: SEED_DEMO_DATA
        value: "true"

  # CodeLens Celery Worker
  - type: worker
    name: codelens-worker
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "celery --workdir backend -A codelens worker -l info --concurrency=2"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: codelens-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: codelens-redis
          property: connectionString
      - key: AI_PROVIDER
        value: "mock"

  # CodeLens Frontend Static Site
  - type: web
    name: codelens-web
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: codelens-db
    databaseName: codelens
    user: postgres
    plan: starter

  - type: redis
    name: codelens-redis
    ipAllowList: []
    plan: starter
